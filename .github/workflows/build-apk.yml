
name: Build Music Air APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found."
            exit 1
          fi

          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

          SETTINGS_FILE=$(find project -type f -name "settings.gradle.kts" -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download Gradle
        shell: bash
        run: |
          set -euo pipefail

          VERSION="8.11.1"
          ZIP="$RUNNER_TEMP/gradle.zip"

          URLS=(
            "https://downloads.gradle.org/distributions/gradle-$VERSION-bin.zip"
            "https://services.gradle.org/distributions/gradle-$VERSION-bin.zip"
            "https://mirrors.cloud.tencent.com/gradle/gradle-$VERSION-bin.zip"
          )

          SUCCESS=false

          for URL in "${URLS[@]}"; do
            echo "Trying $URL"
            rm -f "$ZIP"

            if curl -fL --connect-timeout 30 --max-time 300 \
              --retry 2 --retry-all-errors "$URL" -o "$ZIP" \
              && unzip -tq "$ZIP" >/dev/null 2>&1; then
              SUCCESS=true
              break
            fi
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "ERROR: Gradle download failed."
            exit 1
          fi

          unzip -q "$ZIP" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-$VERSION/bin" >> "$GITHUB_PATH"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-musicair-gradle-${{ hashFiles('project/**/*.gradle*', 'project/**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-musicair-gradle-

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle --no-daemon --stacktrace assembleDebug

          APK=$(find app/build/outputs/apk/debug \
            -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not generated."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/MusicAir.apk"

          echo "APK generated successfully."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicAir-APK
          path: output/MusicAir.apk
          if-no-files-found: error
          retention-days: 7
