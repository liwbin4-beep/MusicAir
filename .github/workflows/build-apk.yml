
name: Build Music Air APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found."
            exit 1
          fi

          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

          PROJECT_DIR=$(find project -type f -name "settings.gradle.kts" -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download Gradle with fallback mirrors
        shell: bash
        run: |
          set -euo pipefail

          VERSION="8.11.1"
          ZIP="$RUNNER_TEMP/gradle-$VERSION-bin.zip"
          DIR="$RUNNER_TEMP/gradle-$VERSION"

          URLS=(
            "https://downloads.gradle.org/distributions/gradle-$VERSION-bin.zip"
            "https://services.gradle.org/distributions/gradle-$VERSION-bin.zip"
            "https://mirrors.cloud.tencent.com/gradle/gradle-$VERSION-bin.zip"
          )

          DOWNLOADED=false

          for URL in "${URLS[@]}"; do
            echo "Trying: $URL"

            if curl -fL \
              --connect-timeout 20 \
              --max-time 300 \
              --retry 2 \
              --retry-all-errors \
              "$URL" -o "$ZIP"; then
              DOWNLOADED=true
              break
            fi

            rm -f "$ZIP"
          done

          if [ "$DOWNLOADED" != "true" ]; then
            echo "ERROR: All Gradle download sources failed."
            exit 1
          fi

          unzip -q "$ZIP" -d "$RUNNER_TEMP"

          echo "$DIR/bin" >> "$GITHUB_PATH"

          "$DIR/bin/gradle" --version

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle --no-daemon --stacktrace assembleDebug

          APK=$(find app/build/outputs/apk/debug \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not generated."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/MusicAir.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicAir-APK
          path: output/MusicAir.apk
          if-no-files-found: error
          retention-days: 7
