
name: Build Music Air APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found."
            exit 1
          fi

          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

          PROJECT_DIR=$(find project -type f -name "settings.gradle.kts" -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Project configuration not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download Gradle
        shell: bash
        run: |
          set -euo pipefail

          VERSION="8.11.1"
          ZIP="$RUNNER_TEMP/gradle.zip"

          URLS=(
            "https://downloads.gradle.org/distributions/gradle-$VERSION-bin.zip"
            "https://services.gradle.org/distributions/gradle-$VERSION-bin.zip"
            "https://mirrors.cloud.tencent.com/gradle/gradle-$VERSION-bin.zip"
          )

          for URL in "${URLS[@]}"; do
            echo "Trying $URL"

            if curl -fL --connect-timeout 30 --max-time 300 \
              --retry 3 --retry-all-errors "$URL" -o "$ZIP"; then
              break
            fi

            rm -f "$ZIP"
          done

          if [ ! -s "$ZIP" ]; then
            echo "ERROR: Gradle download failed."
            exit 1
          fi

          unzip -q "$ZIP" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-$VERSION/bin" >> "$GITHUB_PATH"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-musicair-gradle-${{ hashFiles('project/**/*.gradle*', 'project/**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-musicair-gradle-

      - name: Prepare Kotlin compiler local repository
        shell: bash
        run: |
          set -euo pipefail

          VERSION="2.0.21"
          GROUP_PATH="org/jetbrains/kotlin/kotlin-compiler-embeddable/$VERSION"
          REPO="$RUNNER_TEMP/kotlin-local"
          DEST="$REPO/$GROUP_PATH"

          mkdir -p "$DEST"

          BASE_URLS=(
            "https://maven.aliyun.com/repository/central"
            "https://repo.huaweicloud.com/repository/maven"
            "https://maven.wso2.org/nexus/content/repositories/central"
          )

          SUCCESS=false

          for BASE in "${BASE_URLS[@]}"; do
            echo "Trying Kotlin mirror: $BASE"

            rm -f "$DEST"/*

            if curl -fL --connect-timeout 30 --max-time 300 \
              --retry 3 --retry-all-errors \
              "$BASE/$GROUP_PATH/kotlin-compiler-embeddable-$VERSION.pom" \
              -o "$DEST/kotlin-compiler-embeddable-$VERSION.pom" \
              && curl -fL --connect-timeout 30 --max-time 300 \
              --retry 3 --retry-all-errors \
              "$BASE/$GROUP_PATH/kotlin-compiler-embeddable-$VERSION.jar" \
              -o "$DEST/kotlin-compiler-embeddable-$VERSION.jar"; then

              if unzip -t "$DEST/kotlin-compiler-embeddable-$VERSION.jar" >/dev/null 2>&1; then
                SUCCESS=true
                echo "Kotlin compiler downloaded and verified."
                break
              fi
            fi
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "ERROR: All Kotlin compiler mirrors failed."
            exit 1
          fi

          echo "KOTLIN_LOCAL_REPO=$REPO" >> "$GITHUB_ENV"

      - name: Configure dependency repositories
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/musicair.init.gradle" <<'EOF'
          gradle.beforeProject { project ->
              project.buildscript.repositories {
                  maven {
                      name = "localKotlinCompiler"
                      url = uri(System.getenv("KOTLIN_LOCAL_REPO"))
                  }
                  maven {
                      name = "aliyunCentral"
                      url = uri("https://maven.aliyun.com/repository/central")
                  }
                  maven {
                      name = "huaweiCentral"
                      url = uri("https://repo.huaweicloud.com/repository/maven")
                  }
                  maven {
                      name = "wso2Central"
                      url = uri("https://maven.wso2.org/nexus/content/repositories/central")
                  }
              }

              project.repositories {
                  maven {
                      url = uri("https://maven.aliyun.com/repository/central")
                  }
                  maven {
                      url = uri("https://repo.huaweicloud.com/repository/maven")
                  }
                  maven {
                      url = uri("https://maven.wso2.org/nexus/content/repositories/central")
                  }
              }
          }
          EOF

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            --init-script "$RUNNER_TEMP/musicair.init.gradle" \
            assembleDebug

          APK=$(find app/build/outputs/apk/debug \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not generated."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/MusicAir.apk"

          echo "APK generated successfully."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicAir-APK
          path: output/MusicAir.apk
          if-no-files-found: error
          retention-days: 7
